<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Comissão — Bolsa</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f3;
      color: #1a1a18;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e0dfd8;
      padding: 2rem;
      width: 100%;
      max-width: 620px;
    }

    h1 {
      font-size: 18px;
      font-weight: 500;
      color: #1a1a18;
      margin-bottom: 1.75rem;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      color: #888780;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .toggle-group {
      display: flex;
      gap: 6px;
      margin-bottom: 1.25rem;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px 0;
      border: 1px solid #d3d1c7;
      border-radius: 8px;
      background: #fff;
      color: #888780;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .toggle-btn:hover { background: #f5f5f3; }

    .toggle-btn.active {
      background: #f1efe8;
      border-color: #b4b2a9;
      color: #1a1a18;
      font-weight: 500;
    }

    .field-row { margin-bottom: 1.25rem; }

    .field-row label {
      display: block;
      font-size: 13px;
      color: #888780;
      margin-bottom: 6px;
    }

    .field-row input[type=number] {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border: 1px solid #d3d1c7;
      border-radius: 8px;
      font-size: 14px;
      color: #1a1a18;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    .field-row input[type=number]:focus { border-color: #888780; }

    .input-wrap { display: flex; }

    .input-wrap input[type=number] {
      border-radius: 8px 0 0 8px !important;
      flex: 1;
    }

    .input-suffix-box {
      padding: 0 12px;
      height: 36px;
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #888780;
      background: #f1efe8;
      border: 1px solid #d3d1c7;
      border-left: none;
      border-radius: 0 8px 8px 0;
    }

    .hint {
      font-size: 12px;
      margin-top: 6px;
      padding: 6px 10px;
      background: #f5f5f3;
      border-radius: 8px;
      color: #888780;
    }

    .divider {
      border: none;
      border-top: 1px solid #e0dfd8;
      margin: 1.5rem 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .metric {
      background: #f5f5f3;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .metric.accent { background: #eaf3de; }

    .m-label {
      font-size: 12px;
      color: #888780;
      margin-bottom: 4px;
    }

    .metric.accent .m-label { color: #3b6d11; }

    .m-value {
      font-size: 20px;
      font-weight: 500;
      color: #1a1a18;
    }

    .metric.accent .m-value { color: #3b6d11; }

    .breakdown {
      border: 1px solid #e0dfd8;
      border-radius: 12px;
      overflow: hidden;
    }

    .brow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      font-size: 13px;
      border-bottom: 1px solid #e0dfd8;
    }

    .brow:last-child { border-bottom: none; }

    .brow.total {
      background: #f5f5f3;
      font-weight: 500;
    }

    .b-label { color: #888780; }
    .brow.total .b-label { color: #1a1a18; }
    .b-val { font-weight: 500; color: #1a1a18; }
    .b-val.pos { color: #3b6d11; }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 6px;
      margin-left: 5px;
      font-weight: 400;
    }

    .badge-info  { background: #e6f1fb; color: #185fa5; }
    .badge-warn  { background: #faeeda; color: #854f0b; }
    .badge-ok    { background: #eaf3de; color: #3b6d11; }

    @media (max-width: 480px) {
      .metric-grid { grid-template-columns: 1fr; }
      .card { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Simulador de comissão — Bolsa</h1>

    <p class="section-label">Tipo de venda</p>
    <div class="toggle-group" id="tipo-group">
      <button class="toggle-btn active" onclick="setTipo('novo', this)">Seguro novo</button>
      <button class="toggle-btn" onclick="setTipo('renovacao', this)">Renovação</button>
    </div>

    <div class="field-row">
      <label>Valor elegível (R$)</label>
      <input type="number" id="valor" value="10000" min="0" step="100" oninput="calc()" />
    </div>

    <div class="field-row">
      <label>Atingimento da meta (%)</label>
      <div class="input-wrap">
        <input type="number" id="meta-pct" value="100" min="0" max="300" step="1" oninput="calc()" />
        <span class="input-suffix-box">%</span>
      </div>
      <div class="hint" id="hint-meta"></div>
    </div>

    <p class="section-label" style="margin-top: 1.25rem;">Faixa de cross sell</p>
    <div class="toggle-group" id="cross-group">
      <button class="toggle-btn active" onclick="setCross('nao', this)">Sem cross sell</button>
      <button class="toggle-btn" onclick="setCross('medio', this)">1,10 – 1,19×</button>
      <button class="toggle-btn" onclick="setCross('alto', this)">≥ 1,20×</button>
    </div>
    <div class="hint" id="hint-cross"></div>

    <hr class="divider">

    <div class="metric-grid">
      <div class="metric">
        <div class="m-label">Comissão base</div>
        <div class="m-value" id="res-base">—</div>
      </div>
      <div class="metric">
        <div class="m-label">% total aplicado</div>
        <div class="m-value" id="res-pct">—</div>
      </div>
      <div class="metric accent">
        <div class="m-label">Comissão total</div>
        <div class="m-value" id="res-total">—</div>
      </div>
    </div>

    <div class="breakdown" id="breakdown"></div>
  </div>

  <script>
    let tipo = 'novo';
    let cross = 'nao';

    function setTipo(val, btn) {
      tipo = val;
      document.querySelectorAll('#tipo-group .toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calc();
    }

    function setCross(val, btn) {
      cross = val;
      document.querySelectorAll('#cross-group .toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calc();
    }

    function fmt(v) {
      return 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function calc() {
      const valor   = parseFloat(document.getElementById('valor').value) || 0;
      const metaPct = parseFloat(document.getElementById('meta-pct').value) || 0;

      const baseRate = tipo === 'novo' ? 0.12 : 0.048;

      // Acelerador — sempre se aplica, independente do cross sell
      let acelerador = 0;
      if (metaPct >= 120)      acelerador = 0.02;
      else if (metaPct >= 100) acelerador = 0.01;

      // Cross sell: taxas fixas que substituem a base (acelerador soma por cima)
      let crossRate  = 0;
      let crossBadge = '';
      let crossDesc  = '';

      if (cross === 'medio') {
        crossRate  = (tipo === 'novo' ? 0.135 : 0.054) - baseRate;
        crossBadge = 'badge-info';
        crossDesc  = tipo === 'novo'
          ? 'Cross sell 1,10–1,19× (13,5%)'
          : 'Cross sell 1,10–1,19× (5,4%)';
      } else if (cross === 'alto') {
        crossRate  = (tipo === 'novo' ? 0.15 : 0.06) - baseRate;
        crossBadge = 'badge-ok';
        crossDesc  = tipo === 'novo'
          ? 'Cross sell ≥1,20× (15%)'
          : 'Cross sell ≥1,20× (6%)';
      }

      const totalRate = baseRate + crossRate + acelerador;

      const comBase  = valor * baseRate;
      const comCross = valor * crossRate;
      const comAcel  = valor * acelerador;
      const comTotal = valor * totalRate;

      document.getElementById('res-base').textContent  = fmt(comBase);
      document.getElementById('res-pct').textContent   = (totalRate * 100).toFixed(1) + '%';
      document.getElementById('res-total').textContent = fmt(comTotal);

      // Hint meta
      const acelLabel = metaPct >= 120
        ? 'Superação ≥120% (+2%)'
        : metaPct >= 100
          ? 'Atingimento ≥100% (+1%)'
          : 'Abaixo da meta (sem acelerador)';
      const acelBadge = metaPct >= 120 ? 'badge-ok' : metaPct >= 100 ? 'badge-info' : 'badge-warn';
      document.getElementById('hint-meta').innerHTML =
        `<span class="badge ${acelBadge}" style="margin-left:0">${acelLabel}</span>`;

      // Hint cross
      if (cross === 'nao') {
        document.getElementById('hint-cross').innerHTML =
          `<span class="badge badge-warn" style="margin-left:0">Sem cross sell — apenas base + acelerador</span>`;
      } else {
        document.getElementById('hint-cross').innerHTML =
          `<span class="badge ${crossBadge}" style="margin-left:0">${crossDesc}</span>`;
      }

      // Breakdown
      let rows = `<div class="brow">
        <span class="b-label">Comissão base (${(baseRate * 100).toFixed(1)}%)</span>
        <span class="b-val">${fmt(comBase)}</span>
      </div>`;

      if (cross !== 'nao') {
        rows += `<div class="brow">
          <span class="b-label">${crossDesc} <span class="badge ${crossBadge}">cross sell</span></span>
          <span class="b-val pos">+${fmt(comCross)}</span>
        </div>`;
      }

      const acelRowLabel = metaPct >= 120
        ? 'Superação ≥120%'
        : metaPct >= 100
          ? 'Atingimento de meta'
          : 'Abaixo da meta';
      const acelRowBadge = metaPct >= 120 ? 'badge-ok' : metaPct >= 100 ? 'badge-info' : 'badge-warn';
      rows += `<div class="brow">
        <span class="b-label">${acelRowLabel} (+${(acelerador * 100).toFixed(1)}%) <span class="badge ${acelRowBadge}">acelerador</span></span>
        <span class="b-val ${acelerador > 0 ? 'pos' : ''}">${acelerador > 0 ? '+' + fmt(comAcel) : 'R$ 0,00'}</span>
      </div>`;

      rows += `<div class="brow total">
        <span class="b-label">Total</span>
        <span class="b-val">${fmt(comTotal)}</span>
      </div>`;

      document.getElementById('breakdown').innerHTML = rows;
    }

    calc();
  </script>
</body>
</html>
